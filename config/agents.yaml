# Agent layer settings (python -m agents ...).
# MCP_URL and AGENT_MODEL in .env override mcp_url and openai.model.

mcp_url: http://127.0.0.1:8000/mcp
poll_seconds: 2            # how often the supervisor checks for new events
batch_size: 20             # events fetched per poll
concurrency: 4             # events handled at the same time
event_timeout_seconds: 90  # an event taking longer is logged as an error and skipped

openai:
  model: gpt-6-luna
  # USD per 1M tokens, used only for the cost estimate printed per event.
  # Copied from OpenAI's pricing page (standard tier) on 2026-11-14.
  prices:
    gpt-6-luna:    {input: 0.10, cached_input: 0.01,  output: 0.50}
    gpt-5-nano:    {input: 0.05, cached_input: 0.005, output: 0.40}
    gpt-5-mini:    {input: 0.25, cached_input: 0.025, output: 2.00}
    gpt-4o-mini:   {input: 0.15, cached_input: 0.075, output: 0.60}
    gpt-5.6-luna:  {input: 0.20, cached_input: 0.02,  output: 1.20}
    gpt-6.1-terra: {input: 1.00, cached_input: 0.05,  output: 5.00}
